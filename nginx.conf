server {
    listen 80;

    # Allow large static files (Earth texture is 22MB)
    client_max_body_size 50M;

    # Serve the React app (SPA - Single Page Application)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This makes React Router work correctly (all routes serve index.html)
        try_files $uri $uri/ /index.html;
    }

    # Explicitly serve large static assets (3D models, textures) with no timeout
    location ~* \.(gltf|bin|jpeg|jpg|png|svg|ico|webp)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public";
        # No size limit for static assets
        sendfile on;
        tcp_nopush on;
    }

    # Proxy all /api requests to the Node/Express backend
    location /api/ {
        proxy_pass http://backend:8800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Proxy /health to backend
    location /health {
        proxy_pass http://backend:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
